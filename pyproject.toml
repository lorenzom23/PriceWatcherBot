[project]
name = "pricewatcherbot"
version = "0.1.0"
description = "Telegram bot that tracks online product prices"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "python-dotenv==1.2.2",
    "python-telegram-bot[job-queue]==21.11.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false